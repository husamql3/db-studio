# Top-level configuration
name = "dbstudio"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[routes]]
pattern = "dbstudio.sh"
custom_domain = true

# www resolves to the same worker; src/server.ts 301-redirects it to the apex
[[routes]]
pattern = "www.dbstudio.sh"
custom_domain = true

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# ADMIN_PASSWORD_HASH, ADMIN_SESSION_SECRET, POSTHOG_PERSONAL_API_KEY, and
# SENTRY_AUTH_TOKEN are encrypted Worker secrets (`bun run cf-secrets`).
[vars]
POSTHOG_HOST = "https://eu.posthog.com"
POSTHOG_PROJECT_ID = "267671"
SENTRY_ORG = "husamql3"
SENTRY_HOST = "https://de.sentry.io"

[env.preview]
name = "dbstudio"
workers_dev = true
