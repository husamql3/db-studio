# Top-level configuration
name = "dbstudio"
main = "src/server.ts"
compatibility_date = "2025-09-02"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[routes]]
pattern = "dbstudio.sh"
custom_domain = true

# www resolves to the same worker; src/server.ts 301-redirects it to the apex
[[routes]]
pattern = "www.dbstudio.sh"
custom_domain = true

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[env.preview]
name = "dbstudio"
workers_dev = true
