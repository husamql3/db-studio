name: Release db-studio

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Release db-studio
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build
        run: |
          bun run build:web --force
          bun run build:server --force

      - name: Get package version
        id: get_version
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        run: |
          VERSION=$(node -p "require('./packages/server/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ -n "$(npm view "db-studio@$VERSION" version 2>/dev/null)" ]; then
            echo "db-studio@$VERSION already published — skipping npm publish"
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.get_version.outputs.published == 'false'
        run: npm publish --workspace=packages/server --access=public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate release notes
        id: release_notes
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        run: |
          bun scripts/generate-release-notes.js ${{ steps.get_version.outputs.version }} > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          gh release view "v$VERSION" >/dev/null 2>&1 && exit 0

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"
