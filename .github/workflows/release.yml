name: Release db-studio

on:
  push:
    branches:
      - main
    paths:
      - "packages/server/**"
      - "packages/web/**"
      - "packages/ui/**"
      - "packages/shared/**"
      - "packages/desktop/**"
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "turbo.json"
      - "tsconfig.json"
      - ".github/workflows/release.yml"
      - ".github/workflows/release-desktop.yml"
      - "!**/*.md"
      - "!**/*.test.*"
      - "!packages/server/tests/**"
      - "!packages/server/e2e/**"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compare app version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ] || [[ "$BEFORE" =~ ^0+$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous=$(git show "$BEFORE:packages/server/package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          current=$(node -p "require('./packages/server/package.json').version")
          if [ "$previous" != "$current" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "App version unchanged; skipping npm and desktop release builds"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    name: Build release
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build
        run: |
          bun run build:web --force
          bun run build:server --force
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Get package version
        id: get_version
        run: |
          VERSION=$(node -p "require('./packages/server/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack release
        run: |
          mkdir release
          npm pack --workspace=packages/server --ignore-scripts --pack-destination release

      - name: Generate release notes
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: bun scripts/generate-release-notes.js "$VERSION" > release/release-notes.md

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          name: npm-release
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true')
    runs-on: ubuntu-latest
    name: Publish release
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download release
        uses: actions/download-artifact@v8
        with:
          name: npm-release
          path: release/

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check published version
        id: check_version
        run: |
          if [ -n "$(npm view "db-studio@$VERSION" version 2>/dev/null)" ]; then
            echo "db-studio@$VERSION already published — skipping npm publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # npm must trust husamql3/db-studio's release.yml with direct publishing enabled.
      - name: Publish to npm with OIDC
        if: steps.check_version.outputs.published == 'false'
        run: npm publish "./release/db-studio-$VERSION.tgz" --access=public --ignore-scripts

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "v$VERSION" >/dev/null 2>&1 && exit 0

          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release/release-notes.md \
            --target "$GITHUB_SHA"

  desktop:
    name: Desktop
    needs: [build, publish]
    permissions:
      contents: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
