name: Auto Create PR

on:
  pull_request:
    types: [closed]
    branches:
      - stage
  push:
    branches:
      - stage
jobs:
  create-pr-stage-to-main:
    runs-on: ubuntu-latest
    concurrency:
      group: auto-pr-stage-to-main
      cancel-in-progress: false
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'stage') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/stage')
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare PR body
        id: pr-body
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            {
              echo 'body<<EOF'
              echo 'This PR was automatically created from the `stage` branch.'
              echo ''
              printf 'Triggered by merged PR: #%s\n' "$PR_NUMBER"
              echo ''
              printf '%s\n' "$PR_URL"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          else
            {
              echo 'body<<EOF'
              echo 'This PR was automatically created from the `stage` branch.'
              echo ''
              printf 'Triggered by push to stage: %s\n' "$COMMIT_MESSAGE"
              echo ''
              printf '%s\n' "$COMMIT_URL"
              echo 'EOF'
            } >> $GITHUB_OUTPUT
          fi

      - name: Check if PR already exists
        id: check-pr
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              head: `${context.repo.owner}:stage`
            });
            
            if (prs.length > 0) {
              core.setOutput('exists', 'true');
              core.setOutput('pr_number', prs[0].number);
            } else {
              core.setOutput('exists', 'false');
            }

      - name: Create PR from stage to main
        if: steps.check-pr.outputs.exists == 'false'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: 'stage'
          destination_branch: 'main'
          pr_title: '🎯 Auto PR: stage → main'
          pr_body: ${{ steps.pr-body.outputs.body }}
          pr_draft: false
          github_token: ${{ secrets.GH_TOKEN }}

      - name: Update existing PR
        if: steps.check-pr.outputs.exists == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXISTING_PR_NUMBER: ${{ steps.check-pr.outputs.pr_number }}
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            let body = 'This PR was automatically updated from the `stage` branch.\n\n';

            if (process.env.EVENT_NAME === 'pull_request') {
              body += `Triggered by merged PR: #${process.env.PR_NUMBER}\n\n`;
              body += `Merged PR: ${process.env.PR_URL}`;
            } else {
              body += `Triggered by push to stage: ${process.env.COMMIT_MESSAGE}\n\n`;
              body += `Commit: ${process.env.COMMIT_URL}`;
            }

            const prNumber = Number(process.env.EXISTING_PR_NUMBER);
            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: body
            });

            console.log(`Updated existing PR #${prNumber}`);
