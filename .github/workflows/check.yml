name: Check Code Quality

on:
  push:
    branches:
      - stage
  pull_request:
    branches:
      - stage
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The stage → main PR tests the commit the push to stage already checked.
    if: github.event_name == 'push' || github.head_ref != 'stage'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Build project
        run: bun run build

      - parallel:
          - name: Biome checks
            run: bunx biome ci .

          - name: Type check
            run: bun run typecheck

          - name: Knip
            run: bun run knip

          - name: Web tests
            run: bun run test --filter=@db-studio/web

          - name: Server tests with coverage
            run: bun run --cwd packages/server test:coverage
